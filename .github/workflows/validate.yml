name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: jsonschema installieren
        run: pip install jsonschema

      - name: DENKHUT-6 Konsistenz-Check
        run: python3 scripts/validate.py
